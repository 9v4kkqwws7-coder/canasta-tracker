<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Canasta Beta v2.2</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0f17;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#0b0f17}</style></head><body><iframe id="app" src="../v2/" title="Canasta Beta v2.2"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument,b=d.querySelector('.badge');if(b)b.textContent='BETA v2.2';const p={pfName:'z. B. Team A gegen Team B',pfT1:'z. B. Team A',pfT2:'z. B. Team B',pfP1:'z. B. Spieler 1, Spieler 2',pfP2:'z. B. Spieler 3, Spieler 4'};Object.entries(p).forEach(([i,t])=>{const e=d.getElementById(i);if(e)e.placeholder=t});const s=d.getElementById('profileSelect'),info=d.getElementById('profileInfo');if(s)s.onchange=()=>{const o=s.options[s.selectedIndex];if(info)info.textContent=`Ausgewählt: ${o?o.textContent:''} · mit „Profil übernehmen“ aktivieren`}});</script></body></html>

<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Canasta Beta v2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color-scheme:dark;--b:#0b0f17;--p:#151b26;--p2:#1b2331;--t:#f8fafc;--m:#9ca3af;--l:#2b3545;--a:#f59e0b;--r:#f87171;--j:#c084fc}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t)}button,input,select{font:inherit}.app{max-width:720px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 30px}h1{font-size:23px;margin:0}.muted{color:var(--m)}.badge{font-size:11px;background:#172554;color:#bfdbfe;border:1px solid #1d4ed8;border-radius:99px;padding:3px 7px}.top{display:flex;justify-content:space-between;gap:10px}.note{margin:12px 0;padding:10px 12px;background:#111c32;border:1px solid #1e3a5f;border-radius:13px;color:#bfdbfe;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0}.tab,.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:700}.tab{background:var(--p);color:var(--m);font-size:12px}.tab.on{background:var(--p2);color:var(--t);outline:1px solid var(--l)}.view{display:none}.view.on{display:block}.panel,.card,.stat{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px}.panel{margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.score{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{text-align:center}.card b{display:block;font-size:36px;margin:7px 0}.card small{display:block;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.field{display:block;color:var(--m);font-weight:800}input,select{width:100%;margin-top:5px;background:#0d131d;color:var(--t);border:1px solid var(--l);border-radius:11px;padding:12px}input[type=number]{font-size:20px}.btn{width:100%;margin-top:10px;background:var(--a);color:#171717}.secondary{background:var(--p2);color:var(--t);border:1px solid var(--l)}.counter{margin-top:10px;padding:12px;border-radius:13px}.red{background:#1b1720;border:1px solid #4b2934}.joker{background:#17151f;border:1px solid #493057}.counter h3{margin:0 0 8px;font-size:15px}.red h3,.redmeta{color:var(--r)}.joker h3,.jmeta{color:var(--j)}.preview{font-size:13px;margin:8px 0 0}.list{display:grid;gap:7px}.row,.profile{background:var(--p2);border-radius:12px;padding:11px}.row small{display:block;color:var(--m);margin-top:3px}.acts{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}.acts button{border:0;background:none;color:var(--a);font-weight:700;padding:2px}.stats{display:grid;gap:7px}.stat{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;min-height:54px}.stat b{font-size:22px}.section{font-size:11px;color:var(--m);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:15px 3px 6px}.profgrid{display:grid;gap:8px}.help{font-size:11px;color:var(--m)}.danger{background:#54262b;color:#fff}.hidden{display:none}@media(max-width:420px){.top{align-items:flex-start}.score .card{padding:12px 8px}.card b{font-size:32px}.grid{grid-template-columns:1fr}.tabs{font-size:11px}.row{font-size:14px}}@media(min-width:600px){.stats{grid-template-columns:1fr 1fr}.profgrid{grid-template-columns:1fr 1fr}.profgrid .full{grid-column:1/-1}}
</style></head><body><main class="app"><div class="top"><div><h1>Canasta <span class="badge">BETA v2</span></h1><div id="sub" class="muted">Ziel 5.000</div></div><button id="new" class="tab">Neues Spiel</button></div><div class="note"><b>Testversion:</b> eigener Speicher, kein produktiver Sync.</div><nav class="tabs"><button class="tab on" data-v="game">Spiel</button><button class="tab" data-v="hist">Historie</button><button class="tab" data-v="stats">Statistik</button><button class="tab" data-v="profiles">Profile</button></nav>
<section id="game" class="view on"><div class="panel"><label class="field">Spielprofil<select id="profileSelect"></select></label><div id="profileInfo" class="muted"></div><button id="useProfile" class="btn secondary">Profil übernehmen</button></div><div class="score"><div class="card"><small id="n1">MU</small><small id="pl1"></small><b id="tot1">0</b><small id="rem1">Noch 5.000</small></div><div class="card"><small id="n2">AS</small><small id="pl2"></small><b id="tot2">0</b><small id="rem2">Noch 5.000</small></div></div><div class="panel"><h2 id="roundTitle">Runde 1</h2><div class="grid"><label id="scoreL1" class="field">MU<input id="score1" type="number" step="5"></label><label id="scoreL2" class="field">AS<input id="score2" type="number" step="5"></label></div><div class="counter red"><h3>Rote Dreien</h3><div class="grid"><label class="field">Team 1<input id="red1" type="number" min="0" max="4" value="0"></label><label class="field">Team 2<input id="red2" type="number" min="0" max="4" value="0"></label></div><div id="redPrev" class="preview">0 P · 0 P</div></div><div class="counter joker"><h3>Joker / Zweien</h3><div class="grid"><label class="field">Große Joker · Team 1<input id="big1" type="number" min="0" max="4" value="0"></label><label class="field">Große Joker · Team 2<input id="big2" type="number" min="0" max="4" value="0"></label><label class="field">Kleine Joker / Zweien · Team 1<input id="small1" type="number" min="0" max="8" value="0"></label><label class="field">Kleine Joker / Zweien · Team 2<input id="small2" type="number" min="0" max="8" value="0"></label></div><div id="jPrev" class="preview">0 P · 0 P</div><div class="help">Großer Joker 50 P · Zwei 20 P · nur Auswertung.</div></div><button id="save" class="btn">Runde speichern</button><button id="finish" class="btn secondary">Spiel beenden</button></div><div class="panel"><h2>Runden</h2><div id="rounds" class="list"></div></div></section>
<section id="hist" class="view"><div class="panel"><h2>Spielhistorie</h2><div id="history" class="list"></div></div></section><section id="stats" class="view"><div id="statsBody"></div></section><section id="profiles" class="view"><div class="panel"><h2>Spielprofile</h2><div id="profileList" class="list"></div></div><div class="panel"><h2 id="pfTitle">Neues Profil</h2><input id="editPid" type="hidden"><div class="profgrid"><label class="field full">Profilname<input id="pfName" type="text" placeholder="Wir gegen Schwiegereltern"></label><label class="field">Team 1<input id="pfT1" type="text" placeholder="Wir"></label><label class="field">Team 2<input id="pfT2" type="text" placeholder="Gegner"></label><label class="field">Spieler Team 1<input id="pfP1" type="text" placeholder="Albert, Anna"><span class="help">Mit Komma trennen</span></label><label class="field">Spieler Team 2<input id="pfP2" type="text" placeholder="Maria, Peter"><span class="help">Mit Komma trennen</span></label></div><button id="savePf" class="btn">Profil speichern</button><button id="cancelPf" class="btn secondary hidden">Abbrechen</button></div><div class="panel"><h2>Beta-Daten</h2><button id="export" class="btn secondary">Backup exportieren</button><label class="btn secondary" style="display:block;text-align:center">Backup importieren<input id="import" type="file" accept="application/json,.json" hidden></label><button id="reset" class="btn danger">Alle Beta-Daten löschen</button></div></section></main>
<script>
const K='canastaBetaV2',T=5000,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),clean=s=>(s||'').trim(),fmt=n=>new Intl.NumberFormat('de-DE').format(+n||0),date=s=>new Intl.DateTimeFormat('de-DE',{dateStyle:'medium'}).format(new Date(s));
const def=()=>({id:'std',name:'Standard – MU vs. AS',a:{name:'MU',p:[]},b:{name:'AS',p:[]}}),snap=p=>({pid:p.id,pname:p.name,a:{name:p.a.name,p:[...p.a.p]},b:{name:p.b.name,p:[...p.b.p]}}),fresh=()=>{let p=def();return{profiles:[p],cur:{started:new Date().toISOString(),teams:snap(p),rounds:[]},games:[]}};let S;try{S=JSON.parse(localStorage.getItem(K))||fresh()}catch{S=fresh()}
function norm(){S.profiles=(S.profiles&&S.profiles.length?S.profiles:[def()]);S.games=S.games||[];S.cur=S.cur||{started:new Date().toISOString(),teams:snap(S.profiles[0]),rounds:[]};S.cur.teams=S.cur.teams||snap(S.profiles[0]);S.cur.rounds=(S.cur.rounds||[]).map(r=>({a:+(r.a??r.mu??0),b:+(r.b??r.as??0),r1:+(r.r1??r.redMu??0),r2:+(r.r2??r.redAs??0),g1:+r.g1||0,g2:+r.g2||0,s1:+r.s1||0,s2:+r.s2||0}));S.games=S.games.map(g=>({...g,teams:g.teams||snap(S.profiles[0]),rounds:(g.rounds||[]).map(r=>({a:+(r.a??r.mu??0),b:+(r.b??r.as??0),r1:+(r.r1??r.redMu??0),r2:+(r.r2??r.redAs??0),g1:+r.g1||0,g2:+r.g2||0,s1:+r.s1||0,s2:+r.s2||0}))}))}norm();
const total=rs=>rs.reduce((x,r)=>({a:x.a+r.a,b:x.b+r.b}),{a:0,b:0}),rb=n=>+n===4?800:(+n||0)*100,jv=r=>({a:(r.g1||0)*50+(r.s1||0)*20,b:(r.g2||0)*50+(r.s2||0)*20}),pl=t=>(t.p||[]).join(' & '),lab=t=>pl(t)?`${t.name} · ${pl(t)}`:t.name,save=()=>{localStorage.setItem(K,JSON.stringify(S));render()};
function counters(){let q=x=>+$('#'+x).value||0,c={r1:q('red1'),r2:q('red2'),g1:q('big1'),g2:q('big2'),s1:q('small1'),s2:q('small2')};return c.r1+c.r2<=4&&c.g1+c.g2<=4&&c.s1+c.s2<=8?c:null}
function previews(){let c=counters();if(!c){$('#redPrev').textContent='Zähler prüfen: max. 4 / 4 / 8 insgesamt';$('#jPrev').textContent='Zähler prüfen';return}let t=S.cur.teams,j={a:c.g1*50+c.s1*20,b:c.g2*50+c.s2*20};$('#redPrev').textContent=`${t.a.name}: ${fmt(rb(c.r1))} P · ${t.b.name}: ${fmt(rb(c.r2))} P`;$('#jPrev').textContent=`${t.a.name}: ${fmt(j.a)} P · ${t.b.name}: ${fmt(j.b)} P`}
function profileSelect(){let s=$('#profileSelect');s.innerHTML=S.profiles.map(p=>`<option value="${p.id}" ${p.id===S.cur.teams.pid?'selected':''}>${p.name}</option>`).join('');let p=S.profiles.find(x=>x.id===s.value)||S.profiles[0];$('#profileInfo').textContent=`${lab(p.a)} gegen ${lab(p.b)}`}
function render(){let t=total(S.cur.rounds),z=S.cur.teams;$('#sub').textContent=`${z.a.name} vs. ${z.b.name} · Ziel 5.000`;$('#n1').textContent=z.a.name;$('#n2').textContent=z.b.name;$('#pl1').textContent=pl(z.a);$('#pl2').textContent=pl(z.b);$('#tot1').textContent=fmt(t.a);$('#tot2').textContent=fmt(t.b);$('#rem1').textContent=t.a>=T?'Ziel erreicht':`Noch ${fmt(T-t.a)}`;$('#rem2').textContent=t.b>=T?'Ziel erreicht':`Noch ${fmt(T-t.b)}`;$('#scoreL1').childNodes[0].nodeValue=z.a.name;$('#scoreL2').childNodes[0].nodeValue=z.b.name;$('#roundTitle').textContent=`Runde ${S.cur.rounds.length+1}`;profileSelect();previews();let R=$('#rounds');R.innerHTML=S.cur.rounds.length?'':'Noch keine Runde.';let c={a:0,b:0};S.cur.rounds.forEach((r,i)=>{c.a+=r.a;c.b+=r.b;let j=jv(r),d=document.createElement('div');d.className='row';d.innerHTML=`<b>Runde ${i+1}: ${z.a.name} ${fmt(r.a)} · ${z.b.name} ${fmt(r.b)}</b><small>Gesamt ${fmt(c.a)} : ${fmt(c.b)}</small><small class="redmeta">Rote Dreien ${r.r1} (${fmt(rb(r.r1))}) · ${r.r2} (${fmt(rb(r.r2))})</small><small class="jmeta">Große Joker ${r.g1}:${r.g2} · Zweien ${r.s1}:${r.s2} · Wert ${fmt(j.a)}:${fmt(j.b)} P</small><div class="acts"><button data-del="${i}">Löschen</button></div>`;R.appendChild(d)});let H=$('#history');H.innerHTML=S.games.length?'':'Noch keine beendeten Spiele.';[...S.games].reverse().forEach((g,k)=>{let i=S.games.length-1-k,x=total(g.rounds),w=x.a===x.b?'Unentschieden':x.a>x.b?g.teams.a.name:g.teams.b.name,d=document.createElement('div');d.className='row';d.innerHTML=`<b>${date(g.done)} · ${g.teams.pname}</b><small>${lab(g.teams.a)} gegen ${lab(g.teams.b)}</small><small>${g.teams.a.name} ${fmt(x.a)} : ${fmt(x.b)} ${g.teams.b.name} · Sieger ${w}</small><div class="acts"><button data-gdel="${i}">Löschen</button></div>`;H.appendChild(d)});profiles();stats()}
function profiles(){let L=$('#profileList');L.innerHTML='';S.profiles.forEach(p=>{let d=document.createElement('div');d.className='profile';d.innerHTML=`<b>${p.name}</b><div class="help">${lab(p.a)} gegen ${lab(p.b)}</div><div class="acts"><button data-use="${p.id}">Verwenden</button><button data-edit="${p.id}">Bearbeiten</button>${S.profiles.length>1?`<button data-pdel="${p.id}">Löschen</button>`:''}</div>`;L.appendChild(d)})}
function st(l,v){return`<div class="stat"><span>${l}</span><b>${v}</b></div>`}function stats(){let pg=S.games.filter(g=>g.teams.pid===S.cur.teams.pid),rs=pg.flatMap(g=>g.rounds).concat(S.cur.rounds),w1=0,w2=0,c={r1:0,r2:0,g1:0,g2:0,s1:0,s2:0};pg.forEach(g=>{let t=total(g.rounds);if(t.a>t.b)w1++;if(t.b>t.a)w2++});rs.forEach(r=>Object.keys(c).forEach(k=>c[k]+=r[k]||0));let z=S.cur.teams,h=`<div class="section">Gesamt</div><div class="stats">${st('Partien',S.games.length)}${st('Profile',S.profiles.length)}</div><div class="section">${z.pname}</div><div class="stats">${st('Partien',pg.length)}${st(`Siege ${z.a.name}`,w1)}${st(`Siege ${z.b.name}`,w2)}${st(`Rote Dreien ${z.a.name}`,c.r1)}${st(`Rote Dreien ${z.b.name}`,c.r2)}${st(`Große Joker ${z.a.name}`,c.g1)}${st(`Große Joker ${z.b.name}`,c.g2)}${st(`Zweien ${z.a.name}`,c.s1)}${st(`Zweien ${z.b.name}`,c.s2)}</div>`;let P=new Map;S.games.forEach(g=>{let t=total(g.rounds);[['a','b'],['b','a']].forEach(([a,b])=>(g.teams[a].p||[]).forEach(n=>{let x=P.get(n)||{g:0,w:0};x.g++;if(t[a]>t[b])x.w++;P.set(n,x)}))});if(P.size)h+=`<div class="section">Spielerbilanz</div><div class="stats">${[...P].map(([n,x])=>st(`${n} · ${x.w}/${x.g} Siege`,`${Math.round(x.w/x.g*100)} %`)).join('')}</div>`;$('#statsBody').innerHTML=h}
function use(pid,force=false){let p=S.profiles.find(x=>x.id===pid);if(!p)return;if(S.cur.rounds.length&&!force&&!confirm('Aktuelles Testspiel verwerfen?'))return;S.cur={started:new Date().toISOString(),teams:snap(p),rounds:[]};save()}
$('#save').onclick=()=>{if($('#score1').value===''||$('#score2').value==='')return alert('Punkte für beide Teams eingeben.');let c=counters();if(!c)return alert('Zähler prüfen.');S.cur.rounds.push({a:+$('#score1').value,b:+$('#score2').value,...c});['score1','score2'].forEach(x=>$('#'+x).value='');['red1','red2','big1','big2','small1','small2'].forEach(x=>$('#'+x).value=0);save()};$('#finish').onclick=()=>{if(!S.cur.rounds.length)return;S.games.push({done:new Date().toISOString(),teams:structuredClone(S.cur.teams),rounds:structuredClone(S.cur.rounds)});use(S.cur.teams.pid,true)};$('#new').onclick=()=>use(S.cur.teams.pid,true);$('#useProfile').onclick=()=>use($('#profileSelect').value);$('#profileSelect').onchange=profileSelect;['red1','red2','big1','big2','small1','small2'].forEach(x=>$('#'+x).oninput=previews);$$('.tab[data-v]').forEach(b=>b.onclick=()=>{$$('.tab[data-v]').forEach(x=>x.classList.remove('on'));$$('.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.v).classList.add('on')});
document.onclick=e=>{if(e.target.dataset.del!==undefined&&confirm('Runde löschen?')){S.cur.rounds.splice(+e.target.dataset.del,1);save()}if(e.target.dataset.gdel!==undefined&&confirm('Partie löschen?')){S.games.splice(+e.target.dataset.gdel,1);save()}if(e.target.dataset.use)use(e.target.dataset.use);if(e.target.dataset.edit){let p=S.profiles.find(x=>x.id===e.target.dataset.edit);$('#editPid').value=p.id;$('#pfName').value=p.name;$('#pfT1').value=p.a.name;$('#pfT2').value=p.b.name;$('#pfP1').value=p.a.p.join(', ');$('#pfP2').value=p.b.p.join(', ');$('#pfTitle').textContent='Profil bearbeiten';$('#cancelPf').classList.remove('hidden')}if(e.target.dataset.pdel&&confirm('Profil löschen?')){let q=e.target.dataset.pdel;S.profiles=S.profiles.filter(p=>p.id!==q);if(S.cur.teams.pid===q)use(S.profiles[0].id,true);else save()}};
$('#savePf').onclick=()=>{let n=clean($('#pfName').value),a=clean($('#pfT1').value),b=clean($('#pfT2').value);if(!n||!a||!b)return alert('Profil- und Teamnamen eingeben.');let parse=v=>[...new Set(v.split(',').map(clean).filter(Boolean))],p={id:$('#editPid').value||id(),name:n,a:{name:a,p:parse($('#pfP1').value)},b:{name:b,p:parse($('#pfP2').value)}},i=S.profiles.findIndex(x=>x.id===p.id);if(i>=0)S.profiles[i]=p;else S.profiles.push(p);clearPf();save()};function clearPf(){$('#editPid').value='';['pfName','pfT1','pfT2','pfP1','pfP2'].forEach(x=>$('#'+x).value='');$('#pfTitle').textContent='Neues Profil';$('#cancelPf').classList.add('hidden')}$('#cancelPf').onclick=clearPf;
$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='canasta-beta-v2.json';a.click()};$('#import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(confirm('Beta-Daten ersetzen?')){S=d;norm();save()}}catch{alert('Ungültige Datei')}};$('#reset').onclick=()=>{if(confirm('Alle Beta-Daten löschen?')){S=fresh();save()}};render();
</script></body></html>

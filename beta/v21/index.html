<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Canasta Beta v2.1</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#0b0f17;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#0b0f17}
  </style>
</head>
<body>
  <iframe id="app" src="../v2/" title="Canasta Beta v2.1"></iframe>
  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      const d=frame.contentDocument;
      const select=d.getElementById('profileSelect');
      const info=d.getElementById('profileInfo');
      const badge=d.querySelector('.badge');
      if(badge) badge.textContent='BETA v2.1';
      if(select){
        select.onchange=()=>{
          const option=select.options[select.selectedIndex];
          if(info) info.textContent=`Ausgewählt: ${option ? option.textContent : ''} · mit „Profil übernehmen“ aktivieren`;
        };
      }
    });
  </script>
</body>
</html>
